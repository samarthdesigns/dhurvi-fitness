services:
  - type: web
    name: dhruvis-gym-plan
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/gym.db
    disk:
      name: gym-data
      mountPath: /var/data
      sizeGB: 1
